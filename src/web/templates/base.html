<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Expense App</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1f24;
      --muted: #5b6770;
      --accent: #2563eb;
      --border: #d7dee5;
      --danger: #b91c1c;
      --ok: #166534;
      --control-height: 2.15rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-right: 0.9rem;
      font-size: 0.95rem;
    }
    nav a.active, nav a:hover { color: #fff; }
    main { max-width: 1100px; margin: 1.25rem auto; padding: 0 1rem 2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
    h2 { font-size: 1.05rem; margin: 0 0 0.6rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .flash {
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .flash.ok { background: #dcfce7; color: var(--ok); }
    .flash.err { background: #fee2e2; color: var(--danger); }
    form.inline { display: inline; }
    /* Bottom-align so buttons line up with inputs, not with labels above them */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 0.9rem;
      align-items: flex-end;
      margin-bottom: 0.75rem;
    }
    .row > form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 0.9rem;
      align-items: flex-end;
      margin: 0;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      justify-content: flex-end;
    }
    .field > label {
      margin-bottom: 0;
      min-height: 1.1em;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.2rem; }
    input[type=text], input[type=file], select, textarea {
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      min-width: 10rem;
      min-height: var(--control-height);
      background: #fff;
    }
    button, .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--control-height);
      white-space: nowrap;
    }
    button.secondary, .btn.secondary { background: #475569; }
    button.danger { background: var(--danger); }
    .rule-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 0.9rem;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      padding: 0.75rem 0;
    }
    .rule-row .rule-name {
      min-width: 7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      height: var(--control-height);
    }
    .rule-row .field {
      flex: 1;
      min-width: 16rem;
    }
    .rule-row .field input {
      width: 100%;
    }
    .table-scroll { overflow-x: auto; }
    tr.row-warn td { background: #fef2f2; }
    .status-ok { color: var(--ok); font-weight: 600; }
    .status-bad { color: var(--danger); font-weight: 600; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.4rem;
      text-align: left;
      vertical-align: top;
    }
    th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    .check-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
      gap: 0.35rem 0.75rem;
      margin: 0.5rem 0 0.9rem;
    }
    .check-grid label { color: var(--text); font-size: 0.92rem; }
    footer {
      max-width: 1100px;
      margin: 0 auto 1.5rem;
      padding: 0 1rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Expense App</div>
    <nav>
      <a href="/" class="{% if nav == 'transactions' %}active{% endif %}">Transaktionen</a>
      <a href="/rules" class="{% if nav == 'rules' %}active{% endif %}">Regeln</a>
      <a href="/stats" class="{% if nav == 'stats' %}active{% endif %}">Summen / Excel</a>
      <a href="/receipts" class="{% if nav == 'receipts' %}active{% endif %}">Belege</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Datenverzeichnis: EXPENSE_DATA_DIR</footer>
</body>
</html>
